# Builds the application for Windows and Linux and publishes it as a GitHub release.
#
# Pushing a tag v1.2.3 runs the suite, publishes both builds with version 1.2.3 and creates the
# release of that tag with the two archives attached. Run by hand (Actions > Release > Run
# workflow) it does everything but the release: the archives stay as artifacts of the run, which
# is the way to check a build before tagging it.
#
# The builds are self-contained single files: .NET goes inside, so nothing has to be installed
# to run them. macOS is left out for now; it would need an .app bundle to open with a double click.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Suite
    runs-on: windows-latest

    # The suite takes two minutes here; a hung test would otherwise keep the runner for the six
    # hours GitHub allows by default.
    timeout-minutes: 30

    steps:
      # With the submodule: sasSX assembles the example ROMs in the suite. The other three
      # assemblers are not on the runner, and their tests skip themselves.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build sasSX
        run: dotnet build tools/sass-MSX -c Release --nologo

      - name: Run the suite
        run: >
          dotnet test tests/MSX_GameTools.Tests/MSX_GameTools.Tests.csproj
          -c Release --nologo --blame-hang-timeout 120s

  publish:
    name: Build ${{ matrix.rid }}
    needs: test

    strategy:
      matrix:
        include:
          # Windows on Windows: only there does the SDK write the manifest into the executable.
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The version comes from the tag, without its v. Run by hand there is no tag, and the
      # build says so in its version instead of passing for a release.
      - name: Work out the version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      # The native libraries (Skia, HarfBuzz, ANGLE) go inside the executable as well, and it
      # unpacks them itself on the first run: one file to hand out instead of five. No debug
      # symbols of our own; the ones of the native libraries come in their packages whatever
      # this says, and are left out when packing.
      - name: Publish
        shell: bash
        run: >
          dotnet publish MSX_GameTools.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=$VERSION
          -o publish --nologo

      # Without the .pdb of Skia and HarfBuzz: a hundred megabytes of debug symbols of the
      # native libraries, which nobody running the program needs.
      - name: Pack for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Get-ChildItem publish -File | Where-Object Extension -ne '.pdb' |
          Compress-Archive -DestinationPath "MSX_GameTools-$env:VERSION-${{ matrix.rid }}.zip"

      # A tar and not a zip, because it keeps the permission to run the program.
      - name: Pack for Linux
        if: runner.os == 'Linux'
        run: tar --exclude='*.pdb' -czf "MSX_GameTools-$VERSION-${{ matrix.rid }}.tar.gz" -C publish .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.rid }}
          path: MSX_GameTools-*
          if-no-files-found: error

  release:
    name: Release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The only job that writes to the repository, and only what a release needs.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # A tag with a hyphen —v1.0-beta— goes out as a prerelease, so that the latest release,
      # which is where the README sends people, stays the last one meant for everybody.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${flags[@]}"
